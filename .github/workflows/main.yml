name: 同步 telegram_webproxy.js

on:
  schedule:
    - cron: '0 18 * * *'  # 北京时间每天 02:00 = UTC 18:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 📥 Download telegram_webproxy.js from upstream
        run: |
          echo "开始同步 telegram_webproxy.js ..."
          curl -fsSL "https://raw.githubusercontent.com/ToiCF/CF-Workers-TGProxy/main/telegram_webproxy.js" -o telegram_webproxy.js
          echo "✅ 下载完成"

      - name: 🔍 Check for Changes
        id: check
        run: |
          if git status --porcelain | grep "telegram_webproxy.js"; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "📈 检测到文件变更"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "📊 文件无变化"
          fi

      - name: 🚀 Commit & Push
        if: steps.check.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add telegram_webproxy.js
          git commit -m "🔄 同步 telegram_webproxy.js: $(date +'%Y-%m-%d %H:%M:%S')"
          git push
