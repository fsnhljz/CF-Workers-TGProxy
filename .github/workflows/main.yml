name: 同步上游并部署 Worker

on:
  schedule:
    - cron: '0 18 * * *'   # 北京 02:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 拉最新单文件
        run: |
          curl -fsSL "https://raw.githubusercontent.com/ToiCF/CF-Workers-TGProxy/main/telegram_webproxy.js" -o telegram_webproxy.js

      - name: 检测变更
        id: check
        run: |
          if git status --porcelain | grep "telegram_webproxy.js"; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: 部署到 CF Workers
        
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy telegram_webproxy.js --name tgproxy --keep-vars
