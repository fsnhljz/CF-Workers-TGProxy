name: 自动同步上游并部署 Worker

on:
  schedule:
    # 北京时间每天 02:00 = UTC 18:00
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 📥 拉上游最新 telegram_webproxy.js
        run: |
          curl -fsSL "https://raw.githubusercontent.com/ToiCF/CF-Workers-TGProxy/main/telegram_webproxy.js" -o telegram_webproxy.js

      - name: 🔍 检测是否有变化
        id: check
        run: |
          if git status --porcelain | grep "telegram_webproxy.js"; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: 🚀 部署到 Cloudflare Workers
        if: steps.check.outputs.has_changes == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy telegram_webproxy.js --name tgproxy-auto
